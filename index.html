<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>一页</title>
  <style>
    /* ===== 变量：沿用账本调色板 + 两个作者色 ===== */
    :root {
      --pink:       #f9c4d2;
      --pink-deep:  #f4a0b8;
      --green:      #b5ead7;
      --green-deep: #6dbb99;
      --cream:      #fff8f4;
      --paper:      #fbf6ef;
      --paper-warm: #f6ede0;
      --text:       #5a4a5a;
      --text-light: #9a8a9a;
      --text-soft:  #7a6a7a;

      /* 作者色：批注专用，一个项目的心脏 */
      --ink-mao:    #c68398;
      --ink-arc:    #6b7a9a;

      --shadow:      0 4px 20px rgba(200,180,190,0.20);
      --shadow-soft: 0 2px 10px rgba(200,180,190,0.12);
      --radius:      20px;
      --radius-sm:   12px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'PingFang SC', 'Microsoft YaHei', 'Songti SC', serif;
      background-color: var(--paper);
      background-image:
        radial-gradient(ellipse at top left, rgba(249,196,210,0.10), transparent 55%),
        radial-gradient(ellipse at bottom right, rgba(181,234,215,0.08), transparent 55%);
      background-attachment: fixed;
      color: var(--text);
      min-height: 100vh;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }

    /* ===== 顶部 Header ===== */
    .header {
      background: rgba(255,253,250,0.72);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(249,196,210,0.28);
      padding: 20px 22px 16px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-title {
      font-size: 24px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: 3px;
    }

    .header-subtitle {
      font-size: 12px;
      color: var(--text-light);
      margin-top: 5px;
      letter-spacing: 0.8px;
      font-weight: 400;
    }

    .header-status {
      font-size: 11px;
      color: var(--text-light);
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px dashed rgba(249,196,210,0.35);
      letter-spacing: 0.4px;
    }

    /* ===== 主体 ===== */
    .main {
      max-width: 480px;
      margin: 0 auto;
      padding: 22px 18px 100px;
    }

    /* ===== 页面切换 ===== */
    .page { display: none; }
    .page.active {
      display: block;
      animation: page-in 0.35s ease-out;
    }

    @keyframes page-in {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ===== 空态占位 ===== */
    .empty-hint {
      text-align: center;
      padding: 80px 20px 40px;
      color: var(--text-light);
      font-size: 14px;
      line-height: 2;
      letter-spacing: 0.5px;
    }

    .empty-hint-emoji {
      font-size: 38px;
      margin-bottom: 14px;
      opacity: 0.55;
      display: block;
    }

    /* ===== 底部 nav ===== */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(255,253,250,0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid rgba(249,196,210,0.28);
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 8px 0 14px;
      z-index: 100;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      cursor: pointer;
      padding: 6px 16px;
      border-radius: var(--radius-sm);
      transition: all 0.2s;
      border: none;
      background: none;
    }

    .nav-item.active {
      background: rgba(249,196,210,0.18);
    }

    .nav-icon { font-size: 18px; }

    .nav-label {
      font-size: 10px;
      color: var(--text-light);
      letter-spacing: 0.6px;
    }

    .nav-item.active .nav-label {
      color: var(--pink-deep);
      font-weight: 600;
    }
    
    /* ===== 书架 ===== */
    .shelf-wrap { padding: 4px 2px 20px; }

    .shelf-board {
      position: relative;
      padding: 0 4px 4px;
      margin-bottom: 26px;
    }

    .shelf-books {
      display: flex;
      align-items: flex-end;
      justify-content: flex-start;
      gap: 10px;
      min-height: 150px;
      padding: 4px 8px 2px;
      flex-wrap: wrap;
    }

    .shelf-plank {
      height: 7px;
      border-radius: 3px;
      background: linear-gradient(180deg, rgba(190,168,148,0.35), rgba(160,138,118,0.22));
      box-shadow: 0 2px 6px rgba(160,140,120,0.14);
      margin-top: 4px;
    }

    .book-spine {
      position: relative;
      width: 38px;
      height: 148px;
      border-radius: 4px 4px 3px 3px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 14px 3px 10px;
      box-shadow:
        inset -3px 0 6px rgba(0,0,0,0.08),
        inset 2px 0 3px rgba(255,255,255,0.22),
        0 2px 6px rgba(120,100,110,0.20);
      transition: transform 0.28s cubic-bezier(.34,1.56,.64,1);
      flex-shrink: 0;
      border: none;
    }

    .book-spine:hover,
    .book-spine:active {
      transform: translateY(-8px);
    }

    .book-spine-title {
      writing-mode: vertical-rl;
      -webkit-writing-mode: vertical-rl;
      text-orientation: upright;
      -webkit-text-orientation: upright;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 4px;
      color: rgba(255,253,250,0.94);
      line-height: 1;
      text-shadow: 0 1px 2px rgba(0,0,0,0.12);
    }

    .book-spine-author {
      writing-mode: vertical-rl;
      -webkit-writing-mode: vertical-rl;
      text-orientation: upright;
      -webkit-text-orientation: upright;
      font-size: 9px;
      color: rgba(255,253,250,0.68);
      letter-spacing: 2px;
      margin-top: 10px;
    }

    /* 书签角：有阿奇留的、毛毛还没看的纸条时亮出来 */
    .book-spine-flag {
      position: absolute;
      top: 0;
      right: 0;
      width: 0;
      height: 0;
      border-style: solid;
      border-width: 0 14px 14px 0;
      border-color: transparent var(--ink-arc) transparent transparent;
      filter: drop-shadow(0 1px 2px rgba(0,0,0,0.18));
      animation: flag-in 0.35s ease-out;
    }

    .book-spine-flag.mao {
      border-color: transparent var(--ink-mao) transparent transparent;
    }

    @keyframes flag-in {
      from { opacity: 0; transform: scale(0.6); }
      to   { opacity: 1; transform: scale(1); }
    }

    .book-spine.spine-mao      { }
    .book-spine.spine-arc      { }
    .book-spine.spine-together { }

    /* ===== 妮妮 ===== */
    .nini-wrap {
      position: fixed;
      right: 20px;
      bottom: 78px;
      z-index: 90;
      pointer-events: none;
    }

    .nini {
      pointer-events: auto;
      font-size: 34px;
      cursor: pointer;
      user-select: none;
      display: inline-block;
      transition: transform 0.3s cubic-bezier(.34,1.56,.64,1);
      filter: drop-shadow(0 2px 4px rgba(160,140,120,0.28));
    }

    .nini:active { transform: scale(0.86) rotate(-6deg); }

    .nini.hop {
      animation: nini-hop 0.5s cubic-bezier(.34,1.56,.64,1);
    }

    @keyframes nini-hop {
      0%   { transform: translateY(0) rotate(0); }
      35%  { transform: translateY(-10px) rotate(-8deg); }
      65%  { transform: translateY(-4px) rotate(6deg); }
      100% { transform: translateY(0) rotate(0); }
    }

    .nini-bubble {
      position: absolute;
      right: 44px;
      bottom: 18px;
      background: rgba(255,253,250,0.96);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(249,196,210,0.42);
      border-radius: 12px 12px 4px 12px;
      padding: 7px 12px;
      font-size: 12px;
      color: var(--text);
      max-width: 160px;
      line-height: 1.5;
      white-space: nowrap;
      box-shadow: var(--shadow-soft);
      opacity: 0;
      transform: translateY(4px);
      transition: all 0.25s;
      pointer-events: none;
    }

    .nini-bubble.show {
      opacity: 1;
      transform: translateY(0);
    }
    
    /* ===== 书内页 ===== */
    .book-page {
      background: linear-gradient(180deg, var(--paper) 0%, var(--paper-warm) 100%);
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: 200;
      overflow-y: auto;
      display: none;
      flex-direction: column;
    }
    .book-page.active {
      display: flex;
      animation: page-in 0.35s ease-out;
    }

    .book-topbar {
      background: rgba(255,253,250,0.88);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(200,180,190,0.18);
      padding: 14px 18px calc(14px + env(safe-area-inset-top,0)) 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .book-topbar-btn {
      background: none;
      border: none;
      font-size: 22px;
      color: var(--text-soft);
      cursor: pointer;
      padding: 4px 10px;
      border-radius: 8px;
      transition: background 0.15s;
      line-height: 1;
    }
    .book-topbar-btn:hover { background: rgba(249,196,210,0.15); }

    .book-topbar-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: 3px;
    }

    .book-content {
      max-width: 520px;
      width: 100%;
      margin: 0 auto;
      padding: 34px 26px 28px;
      flex: 1;
    }

    .book-chapter-title {
      text-align: center;
      font-size: 20px;
      font-weight: 500;
      color: var(--text);
      letter-spacing: 6px;
      margin-bottom: 32px;
      padding-bottom: 20px;
      border-bottom: 1px dashed rgba(200,180,190,0.30);
    }

    .book-paragraph {
      font-size: 16px;
      line-height: 2.0;
      color: var(--text);
      margin-bottom: 18px;
      text-indent: 2em;
      letter-spacing: 0.4px;
      padding: 4px 6px;
      border-radius: 4px;
      transition: background 0.2s;
    }
    .book-paragraph:hover {
      background: rgba(249,196,210,0.06);
    }

    .book-footbar {
      background: rgba(255,253,250,0.92);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-top: 1px solid rgba(200,180,190,0.2);
      padding: 12px 18px calc(12px + env(safe-area-inset-bottom,0));
      position: sticky;
      bottom: 0;
    }

    .book-nav-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .book-nav-btn {
      flex: 1;
      background: rgba(249,196,210,0.14);
      border: 1px solid rgba(249,196,210,0.32);
      border-radius: var(--radius-sm);
      padding: 9px 10px;
      font-size: 12px;
      color: var(--text-soft);
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 1px;
    }
    .book-nav-btn:hover:not(:disabled) { background: rgba(249,196,210,0.24); }
    .book-nav-btn:disabled { opacity: 0.32; cursor: default; }

    .book-nav-current {
      font-size: 12px;
      color: var(--text-light);
      padding: 0 12px;
      letter-spacing: 1px;
      white-space: nowrap;
    }

    .book-call-arc {
      width: 100%;
      background: linear-gradient(135deg, var(--ink-arc), #4d5b7a);
      color: rgba(255,253,250,0.96);
      border: none;
      border-radius: var(--radius-sm);
      padding: 11px;
      font-size: 13px;
      letter-spacing: 4px;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 2px 8px rgba(107,122,154,0.28);
    }
    .book-call-arc:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(107,122,154,0.36);
    }

    /* ===== 目录抽屉 ===== */
    .toc-mask {
      position: fixed;
      inset: 0;
      background: rgba(90,74,90,0.28);
      z-index: 300;
      opacity: 0;
      visibility: hidden;
      transition: all 0.25s;
    }
    .toc-mask.show { opacity: 1; visibility: visible; }

    .toc-drawer {
      position: fixed;
      top: 0;
      right: -85%;
      width: 78%;
      max-width: 340px;
      height: 100vh;
      background: var(--paper);
      z-index: 310;
      transition: right 0.32s cubic-bezier(.4,0,.2,1);
      overflow-y: auto;
      box-shadow: -6px 0 20px rgba(90,74,90,0.18);
      display: flex;
      flex-direction: column;
    }
    .toc-drawer.show { right: 0; }

    .toc-header {
      padding: 22px 22px 14px;
      border-bottom: 1px dashed rgba(200,180,190,0.28);
    }
    .toc-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: 3px;
    }
    .toc-sub {
      font-size: 11px;
      color: var(--text-light);
      margin-top: 4px;
      letter-spacing: 0.5px;
    }

    .toc-list { padding: 8px 0; flex: 1; }

    .toc-item {
      padding: 12px 22px;
      font-size: 14px;
      color: var(--text-soft);
      cursor: pointer;
      transition: background 0.15s;
      border-left: 3px solid transparent;
      letter-spacing: 1px;
    }
    .toc-item:hover { background: rgba(249,196,210,0.08); }
    .toc-item.current {
      color: var(--text);
      font-weight: 600;
      border-left-color: var(--pink-deep);
      background: rgba(249,196,210,0.10);
    }
    .toc-item-num {
      color: var(--text-light);
      font-size: 12px;
      margin-right: 12px;
      letter-spacing: 0;
    }

    /* ===== 在读卡片 ===== */
    .reading-card {
      background: rgba(255,253,250,0.75);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(200,180,190,0.22);
      border-radius: var(--radius);
      padding: 22px 20px;
      cursor: pointer;
      transition: all 0.25s;
      box-shadow: var(--shadow-soft);
    }
    .reading-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow);
    }
    .reading-card-title {
      font-size: 20px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: 4px;
      margin-bottom: 4px;
    }
    .reading-card-author {
      font-size: 12px;
      color: var(--text-light);
      letter-spacing: 1px;
    }
    .reading-card-progress {
      font-size: 13px;
      color: var(--text-soft);
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px dashed rgba(200,180,190,0.24);
      letter-spacing: 0.5px;
    }
    .reading-card-cta {
      font-size: 12px;
      color: var(--pink-deep);
      margin-top: 10px;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <header class="header">
    <div class="header-title">一页</div>
    <div class="header-subtitle">陪毛毛一起读的书</div>
    <div class="header-status" id="headerStatus">书架空着，等第一本书</div>
  </header>

  <main class="main">

    <!-- 书架屏 -->
    <div class="page active" id="page-shelf">
      <div class="shelf-wrap" id="shelfWrap"></div>
    </div>

    <!-- 在读 -->
    <div class="page" id="page-reading">
      <div class="empty-hint">
        <span class="empty-hint-emoji">🌱</span>
        还没开始读任何一本
      </div>
    </div>

    <!-- 纸条 -->
    <div class="page" id="page-notes">
      <div class="empty-hint">
        <span class="empty-hint-emoji">📝</span>
        纸条汇总<br>翻到才有
      </div>
    </div>

    <!-- 设置 -->
    <div class="page" id="page-settings">
      <div class="empty-hint">
        <span class="empty-hint-emoji">⚙️</span>
        设置<br>之后再摆
      </div>
    </div>

  </main>

  <nav class="bottom-nav">
    <button class="nav-item active" onclick="switchPage('shelf', this)">
      <span class="nav-icon">📚</span>
      <span class="nav-label">书架</span>
    </button>
    <button class="nav-item" onclick="switchPage('reading', this)">
      <span class="nav-icon">🌱</span>
      <span class="nav-label">在读</span>
    </button>
    <button class="nav-item" onclick="switchPage('notes', this)">
      <span class="nav-icon">📝</span>
      <span class="nav-label">纸条</span>
    </button>
    <button class="nav-item" onclick="switchPage('settings', this)">
      <span class="nav-icon">⚙️</span>
      <span class="nav-label">设置</span>
    </button>
  </nav>

  <script>
    // ===== 数据初始化 =====
    const DEFAULT_BOOKS = [
      {
        id: 'shangshi',
        title: '伤逝',
        subtitle: '涓生的手记',
        author: '鲁迅',
        kind: 'together',          // mao / arc / together
        spineColor: '#a06b7a',
        spineDark:  '#7a4c5d',
        createdAt: Date.now(),
      },
    ];

    function initBooks() {
      if (!localStorage.getItem('books')) {
        localStorage.setItem('books', JSON.stringify(DEFAULT_BOOKS));
      }
    }

    function getBooks() {
      return JSON.parse(localStorage.getItem('books') || '[]');
    }

    function getAnnotations() {
      return JSON.parse(localStorage.getItem('annotations') || '[]');
    }

    // ===== 书架渲染 =====
    function renderShelf() {
      const wrap = document.getElementById('shelfWrap');
      if (!wrap) return;

      const books = getBooks();
      if (books.length === 0) {
        wrap.innerHTML = `
          <div class="empty-hint">
            <span class="empty-hint-emoji">📖</span>
            还没有书<br>第一本正在路上
          </div>`;
        return;
      }

      // 未看纸条数（第 4 段接入批注后会真的用到）
      const annotations = getAnnotations();
      const unseenByBook = {};
      annotations.forEach(a => {
        if (!a.seen) {
          if (!unseenByBook[a.bookId]) unseenByBook[a.bookId] = {};
          unseenByBook[a.bookId][a.author] = (unseenByBook[a.bookId][a.author] || 0) + 1;
        }
      });

      const spinesHtml = books.map(b => {
        const unseen   = unseenByBook[b.id] || {};
        const arcFlag  = unseen.arc > 0;
        const maoFlag  = !arcFlag && unseen.mao > 0;
        const bg = `linear-gradient(180deg, ${b.spineColor} 0%, ${b.spineDark} 100%)`;
        return `
          <button class="book-spine spine-${b.kind}" style="background:${bg};" onclick="openBook('${b.id}')">
            ${arcFlag ? `<div class="book-spine-flag"></div>` : ''}
            ${maoFlag ? `<div class="book-spine-flag mao"></div>` : ''}
            <div class="book-spine-title">${b.title}</div>
            <div class="book-spine-author">${b.author}</div>
          </button>
        `;
      }).join('');

      wrap.innerHTML = `
        <div class="shelf-board">
          <div class="shelf-books">${spinesHtml}</div>
          <div class="shelf-plank"></div>
        </div>
      `;
    }

    function openBook(id) {
      // 第 3 段接入书内页
      alert('书内页在下一步 😌');
    }

    // ===== 顶部状态栏 =====
    function updateHeaderStatus() {
      const books = getBooks();
      const annotations = getAnnotations();
      const arcUnseen = annotations.filter(a => a.author === 'arc' && !a.seen).length;

      const parts = [`在读 ${books.length} 本`];
      if (arcUnseen > 0) parts.push(`阿奇留了 ${arcUnseen} 张纸条`);

      const el = document.getElementById('headerStatus');
      if (el) el.textContent = parts.join(' · ');
    }

    // ===== 页面切换 =====
    function switchPage(name, btn) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
      document.getElementById('page-' + name).classList.add('active');
      if (btn) btn.classList.add('active');

      // 妮妮只蹲在书架
      const niniWrap = document.getElementById('niniWrap');
      if (niniWrap) niniWrap.style.display = (name === 'shelf') ? 'block' : 'none';
    }

    // ===== 妮妮 =====
    const NINI_LINES = [
      '啾～',
      '毛毛翻书了吗',
      '妮妮蹲着',
      '这本书我看过啦（谎）',
      '阿奇又跑哪儿去了',
      '啾啾啾',
      '书香味',
      '妮妮想咬人',
      '毛毛读慢一点',
    ];

    function initNini() {
      const nini   = document.getElementById('nini');
      const bubble = document.getElementById('niniBubble');
      if (!nini) return;

      nini.addEventListener('click', () => {
        const line = NINI_LINES[Math.floor(Math.random() * NINI_LINES.length)];
        bubble.textContent = line;
        bubble.classList.add('show');

        nini.classList.remove('hop');
        void nini.offsetWidth;
        nini.classList.add('hop');

        clearTimeout(bubble._t);
        bubble._t = setTimeout(() => bubble.classList.remove('show'), 2600);
      });
    }

    // ===== 启动 =====
    initBooks();
