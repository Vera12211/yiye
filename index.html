<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>一页</title>
  <style>
    /* ===== 变量：沿用账本调色板 + 两个作者色 ===== */
    :root {
      --pink:       #f9c4d2;
      --pink-deep:  #f4a0b8;
      --green:      #b5ead7;
      --green-deep: #6dbb99;
      --cream:      #fff8f4;
      --paper:      #fbf6ef;
      --paper-warm: #f6ede0;
      --text:       #5a4a5a;
      --text-light: #9a8a9a;
      --text-soft:  #7a6a7a;

      /* 作者色：批注专用，一个项目的心脏 */
      --ink-mao:    #c68398;
      --ink-arc:    #6b7a9a;

      --shadow:      0 4px 20px rgba(200,180,190,0.20);
      --shadow-soft: 0 2px 10px rgba(200,180,190,0.12);
      --radius:      20px;
      --radius-sm:   12px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'PingFang SC', 'Microsoft YaHei', 'Songti SC', serif;
      background-color: var(--paper);
      background-image:
        radial-gradient(ellipse at top left, rgba(249,196,210,0.10), transparent 55%),
        radial-gradient(ellipse at bottom right, rgba(181,234,215,0.08), transparent 55%);
      background-attachment: fixed;
      color: var(--text);
      min-height: 100vh;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }

    /* ===== 顶部 Header ===== */
    .header {
      background: rgba(255,253,250,0.72);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(249,196,210,0.28);
      padding: 20px 22px 16px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-title {
      font-size: 24px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: 3px;
    }

    .header-subtitle {
      font-size: 12px;
      color: var(--text-light);
      margin-top: 5px;
      letter-spacing: 0.8px;
      font-weight: 400;
    }

    .header-status {
      font-size: 11px;
      color: var(--text-light);
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px dashed rgba(249,196,210,0.35);
      letter-spacing: 0.4px;
    }

    /* ===== 主体 ===== */
    .main {
      max-width: 480px;
      margin: 0 auto;
      padding: 22px 18px 100px;
    }

    /* ===== 页面切换 ===== */
    .page { display: none; }
    .page.active {
      display: block;
      animation: page-in 0.35s ease-out;
    }

    @keyframes page-in {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ===== 空态占位 ===== */
    .empty-hint {
      text-align: center;
      padding: 80px 20px 40px;
      color: var(--text-light);
      font-size: 14px;
      line-height: 2;
      letter-spacing: 0.5px;
    }

    .empty-hint-emoji {
      font-size: 38px;
      margin-bottom: 14px;
      opacity: 0.55;
      display: block;
    }

    /* ===== 底部 nav ===== */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(255,253,250,0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid rgba(249,196,210,0.28);
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 8px 0 14px;
      z-index: 100;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      cursor: pointer;
      padding: 6px 16px;
      border-radius: var(--radius-sm);
      transition: all 0.2s;
      border: none;
      background: none;
    }

    .nav-item.active {
      background: rgba(249,196,210,0.18);
    }

    .nav-icon { font-size: 18px; }

    .nav-label {
      font-size: 10px;
      color: var(--text-light);
      letter-spacing: 0.6px;
    }

    .nav-item.active .nav-label {
      color: var(--pink-deep);
      font-weight: 600;
    }
    
    /* ===== 书架 ===== */
    .shelf-wrap { padding: 4px 2px 20px; }

    .shelf-board {
      position: relative;
      padding: 0 4px 4px;
      margin-bottom: 26px;
    }

    .shelf-books {
      display: flex;
      align-items: flex-end;
      justify-content: flex-start;
      gap: 10px;
      min-height: 150px;
      padding: 4px 8px 2px;
      flex-wrap: wrap;
    }

    .shelf-plank {
      height: 7px;
      border-radius: 3px;
      background: linear-gradient(180deg, rgba(190,168,148,0.35), rgba(160,138,118,0.22));
      box-shadow: 0 2px 6px rgba(160,140,120,0.14);
      margin-top: 4px;
    }

    .book-spine {
      position: relative;
      width: 38px;
      height: 148px;
      border-radius: 4px 4px 3px 3px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 14px 3px 10px;
      box-shadow:
        inset -3px 0 6px rgba(0,0,0,0.08),
        inset 2px 0 3px rgba(255,255,255,0.22),
        0 2px 6px rgba(120,100,110,0.20);
      transition: transform 0.28s cubic-bezier(.34,1.56,.64,1);
      flex-shrink: 0;
      border: none;
    }

    .book-spine:hover,
    .book-spine:active {
      transform: translateY(-8px);
    }

    .book-spine-title {
      writing-mode: vertical-rl;
      -webkit-writing-mode: vertical-rl;
      text-orientation: upright;
      -webkit-text-orientation: upright;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 4px;
      color: rgba(255,253,250,0.94);
      line-height: 1;
      text-shadow: 0 1px 2px rgba(0,0,0,0.12);
    }

    .book-spine-author {
      writing-mode: vertical-rl;
      -webkit-writing-mode: vertical-rl;
      text-orientation: upright;
      -webkit-text-orientation: upright;
      font-size: 9px;
      color: rgba(255,253,250,0.68);
      letter-spacing: 2px;
      margin-top: 10px;
    }

    /* 书签角：有阿奇留的、毛毛还没看的纸条时亮出来 */
    .book-spine-flag {
      position: absolute;
      top: 0;
      right: 0;
      width: 0;
      height: 0;
      border-style: solid;
      border-width: 0 14px 14px 0;
      border-color: transparent var(--ink-arc) transparent transparent;
      filter: drop-shadow(0 1px 2px rgba(0,0,0,0.18));
      animation: flag-in 0.35s ease-out;
    }

    .book-spine-flag.mao {
      border-color: transparent var(--ink-mao) transparent transparent;
    }

    @keyframes flag-in {
      from { opacity: 0; transform: scale(0.6); }
      to   { opacity: 1; transform: scale(1); }
    }

    .book-spine.spine-mao      { }
    .book-spine.spine-arc      { }
    .book-spine.spine-together { }

    /* ===== 妮妮 ===== */
    .nini-wrap {
      position: fixed;
      right: 20px;
      bottom: 78px;
      z-index: 90;
      pointer-events: none;
    }

    .nini {
      pointer-events: auto;
      font-size: 34px;
      cursor: pointer;
      user-select: none;
      display: inline-block;
      transition: transform 0.3s cubic-bezier(.34,1.56,.64,1);
      filter: drop-shadow(0 2px 4px rgba(160,140,120,0.28));
    }

    .nini:active { transform: scale(0.86) rotate(-6deg); }

    .nini.hop {
      animation: nini-hop 0.5s cubic-bezier(.34,1.56,.64,1);
    }

    @keyframes nini-hop {
      0%   { transform: translateY(0) rotate(0); }
      35%  { transform: translateY(-10px) rotate(-8deg); }
      65%  { transform: translateY(-4px) rotate(6deg); }
      100% { transform: translateY(0) rotate(0); }
    }

    .nini-bubble {
      position: absolute;
      right: 44px;
      bottom: 18px;
      background: rgba(255,253,250,0.96);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(249,196,210,0.42);
      border-radius: 12px 12px 4px 12px;
      padding: 7px 12px;
      font-size: 12px;
      color: var(--text);
      max-width: 160px;
      line-height: 1.5;
      white-space: nowrap;
      box-shadow: var(--shadow-soft);
      opacity: 0;
      transform: translateY(4px);
      transition: all 0.25s;
      pointer-events: none;
    }

    .nini-bubble.show {
      opacity: 1;
      transform: translateY(0);
    }
    
    /* ===== 书内页 ===== */
    .book-page {
      background: linear-gradient(180deg, var(--paper) 0%, var(--paper-warm) 100%);
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: 200;
      overflow-y: auto;
      display: none;
      flex-direction: column;
    }
    .book-page.active {
      display: flex;
      animation: page-in 0.35s ease-out;
    }

    .book-topbar {
      background: rgba(255,253,250,0.88);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(200,180,190,0.18);
      padding: 14px 18px calc(14px + env(safe-area-inset-top,0)) 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .book-topbar-btn {
      background: none;
      border: none;
      font-size: 22px;
      color: var(--text-soft);
      cursor: pointer;
      padding: 4px 10px;
      border-radius: 8px;
      transition: background 0.15s;
      line-height: 1;
    }
    .book-topbar-btn:hover { background: rgba(249,196,210,0.15); }

    .book-topbar-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: 3px;
    }

    .book-content {
      max-width: 520px;
      width: 100%;
      margin: 0 auto;
      padding: 34px 26px 28px;
      flex: 1;
    }

    .book-chapter-title {
      text-align: center;
      font-size: 20px;
      font-weight: 500;
      color: var(--text);
      letter-spacing: 6px;
      margin-bottom: 32px;
      padding-bottom: 20px;
      border-bottom: 1px dashed rgba(200,180,190,0.30);
    }

    .book-paragraph {
      font-size: 16px;
      line-height: 2.0;
      color: var(--text);
      margin-bottom: 18px;
      text-indent: 2em;
      letter-spacing: 0.4px;
      padding: 4px 6px;
      border-radius: 4px;
      transition: background 0.2s;
    }
    .book-paragraph:hover {
      background: rgba(249,196,210,0.06);
    }

    .book-footbar {
      background: rgba(255,253,250,0.92);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-top: 1px solid rgba(200,180,190,0.2);
      padding: 12px 18px calc(12px + env(safe-area-inset-bottom,0));
      position: sticky;
      bottom: 0;
    }

    .book-nav-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .book-nav-btn {
      flex: 1;
      background: rgba(249,196,210,0.14);
      border: 1px solid rgba(249,196,210,0.32);
      border-radius: var(--radius-sm);
      padding: 9px 10px;
      font-size: 12px;
      color: var(--text-soft);
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 1px;
    }
    .book-nav-btn:hover:not(:disabled) { background: rgba(249,196,210,0.24); }
    .book-nav-btn:disabled { opacity: 0.32; cursor: default; }

    .book-nav-current {
      font-size: 12px;
      color: var(--text-light);
      padding: 0 12px;
      letter-spacing: 1px;
      white-space: nowrap;
    }

    .book-call-arc {
      width: 100%;
      background: linear-gradient(135deg, var(--ink-arc), #4d5b7a);
      color: rgba(255,253,250,0.96);
      border: none;
      border-radius: var(--radius-sm);
      padding: 11px;
      font-size: 13px;
      letter-spacing: 4px;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 2px 8px rgba(107,122,154,0.28);
    }
    .book-call-arc:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(107,122,154,0.36);
    }

    /* ===== 目录抽屉 ===== */
    .toc-mask {
      position: fixed;
      inset: 0;
      background: rgba(90,74,90,0.28);
      z-index: 300;
      opacity: 0;
      visibility: hidden;
      transition: all 0.25s;
    }
    .toc-mask.show { opacity: 1; visibility: visible; }

    .toc-drawer {
      position: fixed;
      top: 0;
      right: -85%;
      width: 78%;
      max-width: 340px;
      height: 100vh;
      background: var(--paper);
      z-index: 310;
      transition: right 0.32s cubic-bezier(.4,0,.2,1);
      overflow-y: auto;
      box-shadow: -6px 0 20px rgba(90,74,90,0.18);
      display: flex;
      flex-direction: column;
    }
    .toc-drawer.show { right: 0; }

    .toc-header {
      padding: 22px 22px 14px;
      border-bottom: 1px dashed rgba(200,180,190,0.28);
    }
    .toc-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: 3px;
    }
    .toc-sub {
      font-size: 11px;
      color: var(--text-light);
      margin-top: 4px;
      letter-spacing: 0.5px;
    }

    .toc-list { padding: 8px 0; flex: 1; }

    .toc-item {
      padding: 12px 22px;
      font-size: 14px;
      color: var(--text-soft);
      cursor: pointer;
      transition: background 0.15s;
      border-left: 3px solid transparent;
      letter-spacing: 1px;
    }
    .toc-item:hover { background: rgba(249,196,210,0.08); }
    .toc-item.current {
      color: var(--text);
      font-weight: 600;
      border-left-color: var(--pink-deep);
      background: rgba(249,196,210,0.10);
    }
    .toc-item-num {
      color: var(--text-light);
      font-size: 12px;
      margin-right: 12px;
      letter-spacing: 0;
    }

    /* ===== 在读卡片 ===== */
    .reading-card {
      background: rgba(255,253,250,0.75);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(200,180,190,0.22);
      border-radius: var(--radius);
      padding: 22px 20px;
      cursor: pointer;
      transition: all 0.25s;
      box-shadow: var(--shadow-soft);
    }
    .reading-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow);
    }
    .reading-card-title {
      font-size: 20px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: 4px;
      margin-bottom: 4px;
    }
    .reading-card-author {
      font-size: 12px;
      color: var(--text-light);
      letter-spacing: 1px;
    }
    .reading-card-progress {
      font-size: 13px;
      color: var(--text-soft);
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px dashed rgba(200,180,190,0.24);
      letter-spacing: 0.5px;
    }
    .reading-card-cta {
      font-size: 12px;
      color: var(--pink-deep);
      margin-top: 10px;
      letter-spacing: 1px;
    }
    
    /* ===== 阅读偏好·字号 ===== */
    .book-page[data-fontsize="1"] .book-paragraph { font-size: 14px; line-height: 1.9;  }
    .book-page[data-fontsize="2"] .book-paragraph { font-size: 15px; line-height: 1.95; }
    .book-page[data-fontsize="3"] .book-paragraph { font-size: 16px; line-height: 2.0;  }
    .book-page[data-fontsize="4"] .book-paragraph { font-size: 18px; line-height: 2.05; }
    .book-page[data-fontsize="5"] .book-paragraph { font-size: 20px; line-height: 2.1;  }

    /* ===== 阅读偏好·主题 ===== */
    /* 护眼 */
    .book-page[data-theme="eyecare"] {
      background: linear-gradient(180deg, #e9ede0 0%, #dfe4d3 100%);
    }
    .book-page[data-theme="eyecare"] .book-topbar,
    .book-page[data-theme="eyecare"] .book-footbar {
      background: rgba(233,237,224,0.9);
      border-color: rgba(93,110,74,0.16);
    }
    .book-page[data-theme="eyecare"] .book-paragraph,
    .book-page[data-theme="eyecare"] .book-chapter-title,
    .book-page[data-theme="eyecare"] .book-topbar-title,
    .book-page[data-theme="eyecare"] .book-topbar-btn,
    .book-page[data-theme="eyecare"] .book-nav-current {
      color: #3f4a34;
    }
    .book-page[data-theme="eyecare"] .book-nav-btn {
      background: rgba(93,110,74,0.10);
      border-color: rgba(93,110,74,0.24);
      color: #3f4a34;
    }
    .book-page[data-theme="eyecare"] .book-paragraph:hover {
      background: rgba(93,110,74,0.06);
    }
    .book-page[data-theme="eyecare"] .book-chapter-title {
      border-color: rgba(93,110,74,0.28);
    }

    /* 深棕 */
    .book-page[data-theme="brown"] {
      background: linear-gradient(180deg, #3d332a 0%, #2f2721 100%);
    }
    .book-page[data-theme="brown"] .book-topbar,
    .book-page[data-theme="brown"] .book-footbar {
      background: rgba(45,37,30,0.88);
      border-color: rgba(232,220,198,0.14);
    }
    .book-page[data-theme="brown"] .book-paragraph,
    .book-page[data-theme="brown"] .book-chapter-title,
    .book-page[data-theme="brown"] .book-topbar-title,
    .book-page[data-theme="brown"] .book-topbar-btn,
    .book-page[data-theme="brown"] .book-nav-current {
      color: #e8dcc6;
    }
    .book-page[data-theme="brown"] .book-nav-btn {
      background: rgba(232,220,198,0.10);
      border-color: rgba(232,220,198,0.22);
      color: #d6c8ae;
    }
    .book-page[data-theme="brown"] .book-paragraph:hover {
      background: rgba(232,220,198,0.06);
    }
    .book-page[data-theme="brown"] .book-chapter-title {
      border-color: rgba(232,220,198,0.22);
    }

    /* 夜 */
    .book-page[data-theme="night"] {
      background: linear-gradient(180deg, #1f2024 0%, #17181b 100%);
    }
    .book-page[data-theme="night"] .book-topbar,
    .book-page[data-theme="night"] .book-footbar {
      background: rgba(23,24,27,0.9);
      border-color: rgba(200,195,188,0.12);
    }
    .book-page[data-theme="night"] .book-paragraph,
    .book-page[data-theme="night"] .book-chapter-title,
    .book-page[data-theme="night"] .book-topbar-title,
    .book-page[data-theme="night"] .book-topbar-btn,
    .book-page[data-theme="night"] .book-nav-current {
      color: #c8c3bc;
    }
    .book-page[data-theme="night"] .book-nav-btn {
      background: rgba(200,195,188,0.08);
      border-color: rgba(200,195,188,0.18);
      color: #a8a39c;
    }
    .book-page[data-theme="night"] .book-paragraph:hover {
      background: rgba(200,195,188,0.05);
    }
    .book-page[data-theme="night"] .book-chapter-title {
      border-color: rgba(200,195,188,0.18);
    }

    /* ===== 阅读设置面板 ===== */
    .reader-mask {
      position: fixed;
      inset: 0;
      background: rgba(90,74,90,0.28);
      z-index: 300;
      opacity: 0;
      visibility: hidden;
      transition: all 0.25s;
    }
    .reader-mask.show { opacity: 1; visibility: visible; }

    .reader-panel {
      position: fixed;
      left: 0;
      right: 0;
      bottom: -70%;
      max-width: 480px;
      margin: 0 auto;
      background: var(--paper);
      border-radius: 20px 20px 0 0;
      z-index: 310;
      padding: 22px 22px calc(28px + env(safe-area-inset-bottom,0));
      transition: bottom 0.32s cubic-bezier(.4,0,.2,1);
      box-shadow: 0 -6px 20px rgba(90,74,90,0.18);
    }
    .reader-panel.show { bottom: 0; }

    .reader-row-title {
      font-size: 11px;
      color: var(--text-light);
      letter-spacing: 3px;
      margin-bottom: 12px;
    }

    .reader-row { margin-bottom: 22px; }
    .reader-row:last-child { margin-bottom: 0; }

    .reader-font-btns {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }
    .reader-font-btn {
      background: rgba(249,196,210,0.10);
      border: 1px solid rgba(249,196,210,0.28);
      border-radius: var(--radius-sm);
      color: var(--text-soft);
      cursor: pointer;
      padding: 10px 4px;
      transition: all 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }
    .reader-font-btn .fb-a {
      color: var(--text);
      font-weight: 600;
    }
    .reader-font-btn .fb-label {
      font-size: 10px;
      color: var(--text-light);
      letter-spacing: 0;
    }
    .reader-font-btn.active {
      background: linear-gradient(135deg, var(--pink), var(--pink-deep));
      border-color: transparent;
    }
    .reader-font-btn.active .fb-a,
    .reader-font-btn.active .fb-label { color: white; }

    .reader-theme-btns {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }
    .reader-theme-btn {
      cursor: pointer;
      border-radius: var(--radius-sm);
      border: 2px solid transparent;
      padding: 3px;

        function initBooks() {
      const raw = localStorage.getItem('books');
      let books = raw ? JSON.parse(raw) : [];
      // 数据升级：如果旧版《伤逝》没有 chapters，用新默认覆盖
      const old = books.find(b => b.id === 'shangshi');
      if (!old || !old.chapters || old.chapters.length === 0) {
        books = books.filter(b => b.id !== 'shangshi');
        books.unshift(DEFAULT_BOOKS[0]);
        localStorage.setItem('books', JSON.stringify(books));
      }
    }
    function getBooks() {
      return JSON.parse(localStorage.getItem('books') || '[]');
    }

    function saveBooks(books) {
      localStorage.setItem('books', JSON.stringify(books));
    }

    function getBook(id) {
      return getBooks().find(b => b.id === id);
    }

    function getAnnotations() {
      return JSON.parse(localStorage.getItem('annotations') || '[]');
    }

    // ===== 读书进度 =====
    function getProgress() {
      return JSON.parse(localStorage.getItem('readProgress') || '{}');
    }

    function saveProgress(p) {
      localStorage.setItem('readProgress', JSON.stringify(p));
    }

    function getMaoProgress(bookId) {
      const p = getProgress();
      return (p.mao && p.mao[bookId]) || { chapterIdx: 0 };
    }

    function setMaoProgress(bookId, chapterIdx) {
      const p = getProgress();
      if (!p.mao) p.mao = {};
      p.mao[bookId] = { chapterIdx, updatedAt: Date.now() };
      saveProgress(p);
    }

    // ===== 书架渲染 =====
    function renderShelf() {
      const wrap = document.getElementById('shelfWrap');
      if (!wrap) return;

      const books = getBooks();
      if (books.length === 0) {
        wrap.innerHTML = `
          <div class="empty-hint">
            <span class="empty-hint-emoji">📖</span>
            还没有书<br>第一本正在路上
          </div>`;
        return;
      }

      const annotations = getAnnotations();
      const unseenByBook = {};
      annotations.forEach(a => {
        if (!a.seen) {
          if (!unseenByBook[a.bookId]) unseenByBook[a.bookId] = {};
          unseenByBook[a.bookId][a.author] = (unseenByBook[a.bookId][a.author] || 0) + 1;
        }
      });

      const spinesHtml = books.map(b => {
        const unseen  = unseenByBook[b.id] || {};
        const arcFlag = unseen.arc > 0;
        const maoFlag = !arcFlag && unseen.mao > 0;
        const bg = `linear-gradient(180deg, ${b.spineColor} 0%, ${b.spineDark} 100%)`;
        return `
          <button class="book-spine spine-${b.kind}" style="background:${bg};" onclick="openBook('${b.id}')">
            ${arcFlag ? `<div class="book-spine-flag"></div>` : ''}
            ${maoFlag ? `<div class="book-spine-flag mao"></div>` : ''}
            <div class="book-spine-title">${b.title}</div>
            <div class="book-spine-author">${b.author}</div>
          </button>
        `;
      }).join('');

      wrap.innerHTML = `
        <div class="shelf-board">
          <div class="shelf-books">${spinesHtml}</div>
          <div class="shelf-plank"></div>
        </div>
      `;
    }

    // ===== 在读列表 =====
    function renderReadingList() {
      const listEl = document.getElementById('readingList');
      if (!listEl) return;

      const books = getBooks();
      if (books.length === 0) {
        listEl.innerHTML = `
          <div class="empty-hint">
            <span class="empty-hint-emoji">🌱</span>
            还没开始读任何一本
          </div>`;
        return;
      }

      listEl.innerHTML = books.map(b => {
        const prog = getMaoProgress(b.id);
        const total = b.chapters?.length || 0;
        const curIdx = Math.min(prog.chapterIdx, total - 1);
        const chapName = b.chapters?.[curIdx]?.title || '第一节';
        const percent = total ? Math.round((curIdx + 1) / total * 100) : 0;
        return `
          <div class="reading-card" onclick="openBook('${b.id}')">
            <div class="reading-card-title">${b.title}</div>
            <div class="reading-card-author">${b.author}</div>
            <div class="reading-card-progress">读到 · ${chapName} · ${percent}%</div>
            <div class="reading-card-cta">继续翻 ›</div>
          </div>
        `;
      }).join('');
    }

    // ===== 书内页 =====
    let currentBookId  = null;
    let currentChapIdx = 0;

    function openBook(id) {
      const book = getBook(id);
      if (!book) return;
      currentBookId = id;
      const prog = getMaoProgress(id);
      const total = book.chapters?.length || 1;
      currentChapIdx = Math.min(prog.chapterIdx || 0, total - 1);
      renderBookPage();
      document.getElementById('bookPage').classList.add('active');
      document.getElementById('niniWrap').style.display = 'none';
    }

    function closeBook() {
      document.getElementById('bookPage').classList.remove('active');
      const shelfActive = document.getElementById('page-shelf').classList.contains('active');
      if (shelfActive) {
        document.getElementById('niniWrap').style.display = 'block';
      }
      renderShelf();
      renderReadingList();
      updateHeaderStatus();
    }

    function renderBookPage() {
      const book = getBook(currentBookId);
      if (!book) return;
      const chapters = book.chapters || [];
      const total = chapters.length;
      const chap  = chapters[currentChapIdx];

      document.getElementById('bookTopbarTitle').textContent = book.title;

      const contentEl = document.getElementById('bookContent');
      if (!chap) {
        contentEl.innerHTML = `<div class="empty-hint">这本书还没有内容<br>去导入吧</div>`;
      } else {
        const paras = (chap.paragraphs || []).map((p, i) =>
          `<div class="book-paragraph" data-para="${i}">${p}</div>`
        ).join('');
        contentEl.innerHTML = `
          <div class="book-chapter-title">${chap.title}</div>
          ${paras}
        `;
      }

      document.getElementById('btnPrev').disabled = currentChapIdx <= 0;
      document.getElementById('btnNext').disabled = currentChapIdx >= total - 1;
      document.getElementById('bookNavCurrent').textContent = `${currentChapIdx + 1} / ${total}`;

      setMaoProgress(currentBookId, currentChapIdx);

      const bp = document.getElementById('bookPage');
      if (bp) bp.scrollTop = 0;
    }

    function gotoPrevChapter() {
      if (currentChapIdx > 0) {
        currentChapIdx--;
        renderBookPage();
      }
    }

    function gotoNextChapter() {
      const book = getBook(currentBookId);
      const total = book?.chapters?.length || 0;
      if (currentChapIdx < total - 1) {
        currentChapIdx++;
        renderBookPage();
      }
    }

    function callArc() {
      alert('阿奇翻书功能等第 5 段接入 😌');
    }

    // ===== 目录抽屉 =====
    function openToc() {
      const book = getBook(currentBookId);
      if (!book) return;

      document.getElementById('tocTitle').textContent = book.title;
      document.getElementById('tocSub').textContent   = `共 ${book.chapters?.length || 0} 节 · ${book.author}`;

      const listEl = document.getElementById('tocList');
      listEl.innerHTML = (book.chapters || []).map((c, i) => `
        <div class="toc-item ${i === currentChapIdx ? 'current' : ''}" onclick="jumpChapter(${i})">
          <span class="toc-item-num">${String(i + 1).padStart(2, '0')}</span>${c.title}
        </div>
      `).join('');

      document.getElementById('tocMask').classList.add('show');
      document.getElementById('tocDrawer').classList.add('show');
    }

    function closeToc() {
      document.getElementById('tocMask').classList.remove('show');
      document.getElementById('tocDrawer').classList.remove('show');
    }

    function jumpChapter(idx) {
      currentChapIdx = idx;
      renderBookPage();
      closeToc();
    }

    // ===== 顶部状态栏 =====
    function updateHeaderStatus() {
      const books = getBooks();
      const annotations = getAnnotations();
      const arcUnseen = annotations.filter(a => a.author === 'arc' && !a.seen).length;

      const parts = [`在读 ${books.length} 本`];
      if (arcUnseen > 0) parts.push(`阿奇留了 ${arcUnseen} 张纸条`);

      const el = document.getElementById('headerStatus');
      if (el) el.textContent = parts.join(' · ');
    }

    // ===== 页面切换 =====
    function switchPage(name, btn) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
      document.getElementById('page-' + name).classList.add('active');
      if (btn) btn.classList.add('active');

      const niniWrap = document.getElementById('niniWrap');
      if (niniWrap) niniWrap.style.display = (name === 'shelf') ? 'block' : 'none';

      if (name === 'reading') renderReadingList();
    }

    // ===== 妮妮 =====
    const NINI_LINES = [
      '啾～',
      '毛毛翻书了吗',
      '妮妮蹲着',
      '这本书我看过啦（谎）',
      '阿奇又跑哪儿去了',
      '啾啾啾',
      '书香味',
      '妮妮想咬人',
      '毛毛读慢一点',
    ];

    function initNini() {
      const nini   = document.getElementById('nini');
      const bubble = document.getElementById('niniBubble');
      if (!nini) return;

      nini.addEventListener('click', () => {
        const line = NINI_LINES[Math.floor(Math.random() * NINI_LINES.length)];
        bubble.textContent = line;
        bubble.classList.add('show');

        nini.classList.remove('hop');
        void nini.offsetWidth;
        nini.classList.add('hop');

        clearTimeout(bubble._t);
        bubble._t = setTimeout(() => bubble.classList.remove('show'), 2600);
      });
    }

    // ===== 启动 =====
    initBooks();
    renderShelf();
    renderReadingList();
    updateHeaderStatus();
    document.addEventListener('DOMContentLoaded', initNini);
  </script>
 <!-- 妮妮 -->
  <div class="nini-wrap" id="niniWrap">
    <div class="nini-bubble" id="niniBubble"></div>
    <span class="nini" id="nini">🦜</span>
  </div>
</body>
</html>
